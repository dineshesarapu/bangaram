<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Special Memories & Blog</title>
  <style>
    :root {
      --primary: #e63946;
      --primary-hover: #d62839;
      --bg: #fff5f5;
      --card-bg: #ffffff;
      --text: #2b2d42;
      --muted: #6c757d;
      --border: #f1faee;
      --shadow: 0 4px 15px rgba(230, 57, 70, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }

    /* Header & Navigation */
    header {
      background: #ffffff;
      border-bottom: 1px solid #ffe3e3;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    header h2 { margin: 0; color: var(--primary); font-size: 1.4rem; }

    .btn-add {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .btn-add:hover { background: var(--primary-hover); transform: translateY(-1px); }

    /* Layout Container */
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* Section Titles */
    .section-title {
      font-size: 1.25rem;
      border-bottom: 3px solid var(--primary);
      display: inline-block;
      padding-bottom: 4px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    /* 1. HERO POST LOCATION */
    .hero-section { margin-bottom: 40px; }
    .hero-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      border: 1px solid #ffe3e3;
    }
    @media (min-width: 768px) {
      .hero-card { flex-direction: row; }
      .hero-image { width: 45%; min-height: 400px; object-fit: cover; }
      .hero-content { width: 55%; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
    }
    .hero-image { width: 100%; height: 260px; object-fit: cover; }
    .hero-content { padding: 25px; }
    .hero-tag { background: #ffe3e3; color: var(--primary); font-size: 0.8rem; font-weight: bold; padding: 4px 10px; border-radius: 12px; width: fit-content; margin-bottom: 12px; }
    .blog-body-text { white-space: pre-line; line-height: 1.7; color: #4a4a4a; font-size: 1rem; margin-top: 15px; }

    /* Main Content Layout (Grid + Sidebar) */
    .main-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
    }
    @media (min-width: 900px) {
      .main-layout { grid-template-columns: 2fr 1fr; }
    }

    /* 2. RECENT POSTS GRID LOCATION */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .grid-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #ffe3e3;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .grid-card img { width: 100%; height: 180px; object-fit: cover; }
    .grid-card-body { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; }
    .grid-card-body h3 { margin: 8px 0; font-size: 1.15rem; color: var(--text); }
    .grid-card-body p { font-size: 0.9rem; color: var(--muted); flex-grow: 1; margin-bottom: 15px; line-height: 1.5; }

    /* 3. SIDEBAR LOCATION */
    .sidebar-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .sidebar-item {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ffe3e3;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .sidebar-item img { width: 65px; height: 65px; border-radius: 8px; object-fit: cover; }
    .sidebar-item h4 { margin: 0 0 4px 0; font-size: 0.95rem; color: var(--text); }
    .sidebar-item span { font-size: 0.75rem; color: var(--muted); }

    /* Modal Form Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    .modal h3 { margin-top: 0; color: var(--primary); }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .btn-cancel { background: #e0e0e0; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Header with Add Blog Button -->
  <header>
    <h2>Our Special Blog</h2>
    <button class="btn-add" onclick="openModal()">+ Add New Blog</button>
  </header>

  <div class="container">
    
    <!-- LOCATION 1: Featured Hero Post (Latest Special Blog) -->
    <section class="hero-section">
      <div class="section-title">Latest Story</div>
      <div id="hero-location"></div>
    </section>

    <!-- Main Layout: Grid + Sidebar -->
    <div class="main-layout">
      
      <!-- LOCATION 2: Recent Posts Grid -->
      <section>
        <div class="section-title">All Posts</div>
        <div id="grid-location" class="grid-container"></div>
      </section>

      <!-- LOCATION 3: Sidebar Recent Posts -->
      <aside>
        <div class="section-title">Quick Highlights</div>
        <div id="sidebar-location" class="sidebar-list"></div>
      </aside>

    </div>
  </div>

  <!-- Modal for Adding New Blog -->
  <div class="modal-overlay" id="blogModal">
    <div class="modal">
      <h3>Create New Blog Post</h3>
      <form id="addBlogForm">
        <div class="form-group">
          <label for="title">Post Title</label>
          <input type="text" id="title" required placeholder="Enter post title">
        </div>
        <div class="form-group">
          <label for="content">Full Story/Content</label>
          <textarea id="content" rows="5" required placeholder="Write your post here..."></textarea>
        </div>
        <div class="form-group">
          <label for="image">Image URL</label>
          <input type="url" id="image" required placeholder="https://images.unsplash.com/photo-1518199266791-5375a83190b7">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-add">Publish Post</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Full Telugu Blog Content
    const teluguBlogText = `Ninna Nenu Choosina Swargam… ❤️

Bangarammmmm…

Nenu chala rojula nundi anukunevadini…
Nuvvu naaku entha special o naaku telusu.
Manam kalisi gadipina prathi moment entha beautiful o kuda telusu.

Kani…
Ninna naaku vachina anandam ela untundo maatram nenu eppudu oohinchaledu.

Life lo chala enjoyments chesanu…
Long drives vellanu…
Bike rides chesanu…
Chala places chusanu…
Chala happy moments experience chesanu…

Kani ninna…
Nenu modatisari nijanga swargam chusanu.

Adi oka place kaadhu.
Adi oka moment kuda kaadhu.
Adi nuvvu nannu poorthiga nee lokam lo kalupukunnav ane feeling.

Ninna edho teliyani oka prapancham lo unnattu anipinchindi.
Manam iddaram veru veru manushulam ane feeling kuda oka kshanam ki ledu…
“Manam iddaram okkate” ane oka teliyani anubhuthi.

Nuvvu nannu nee lokam lo ila kalupukunnav ane feeling…
Adi naa kallalo ippatiki nundi povatam ledu.

Ninna nee daggara unna aa kshanalu gurthosthe…
Naa face meeda teliyakunda navvu vastundi.

Endhukante aa roju nenu kevalam oka beautiful moment ni experience cheyyaledu…
Naa Bangaram tho inka daggara ayyanane feeling ni experience chesanu.

Nuvvu naa jeevitham lo entha important o…
Ninna adi inka deep ga ardham ayyindi.

Thank you Bangarammmmm… ❤️
Naa life lo intha andamaina feeling ni ichinanduku.
Nannu nee lokam lo intha daggaraga chesinanduku.
Ninna naaku ichina aa anandam kosam…
Thank you for everything. ❤️

Kani…
Oka chinna complaint undi… 😜

Bangaram… inka kavali anipisthundi. 😂❤️
Ninna choopinchina aa swargam nachindhi…
Chaaaala nachindhi.

Kabatti ee Bava ki malli aa swargam ki entry pass eppudu isthav? 😜❤️
Entry pass okkasari ichesi lifetime membership lekunda pampinchesthe ee Bava oppukodu madam! 😂
Lifetime membership kavali… one-time experience tho satisfy avvanu! 😜❤️

Please consider my request and approve at the earliest. 😌😂

Endhukante…
Ninna oka sari choosina aa swargam kanna…
Nuvvu pakkana unte prathi roju ade swargam la undali anedhe naa korika. ❤️

Long drive aina…
Bike ride aina…
Oka chinna room lo iddaram maatladukovadam aina…
Naa Bangaram tho unte ade naa swargam. ❤️

Ninna oka kotha memory create ayyindi…
Kani naa korika okkate—
Aa memory ni mana jeevitham motham repeat cheskuntu, inka enno andamaina memories kalisi raasukundam. ❤️

I Love You, Bangarammmmm. 🫶❤️

Yours lovingly,
Mee konchem greedy Bava 😜`;

    // Blog Data Store
    let blogPosts = [
      {
        id: 1,
        title: "Ninna Nenu Choosina Swargam… ❤️",
        content: teluguBlogText,
        image: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=800&q=80",
        date: "Aug 11, 2026"
      },
      {
        id: 2,
        title: "Weekend Getaway & Long Drive",
        content: "Exploring the open roads and taking time off to relax with great music and amazing company.",
        image: "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=800&q=80",
        date: "Aug 05, 2026"
      },
      {
        id: 3,
        title: "Creating Unforgettable Memories",
        content: "It's the small moments, quiet conversations, and shared laughter that build lifetime happiness.",
        image: "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=800&q=80",
        date: "Jul 28, 2026"
      }
    ];

    // Render function across 3 locations
    function renderBlogs() {
      const heroLoc = document.getElementById('hero-location');
      const gridLoc = document.getElementById('grid-location');
      const sidebarLoc = document.getElementById('sidebar-location');

      heroLoc.innerHTML = '';
      gridLoc.innerHTML = '';
      sidebarLoc.innerHTML = '';

      if (blogPosts.length === 0) return;

      // LOCATION 1: Render Latest Post in Hero Section
      const latestPost = blogPosts[0];
      heroLoc.innerHTML = `
        <article class="hero-card">
          <img src="${latestPost.image}" alt="${latestPost.title}" class="hero-image">
          <div class="hero-content">
            <span class="hero-tag">FEATURED STORY</span>
            <h2 style="margin: 0 0 10px 0; color: var(--primary); font-size: 1.6rem;">${latestPost.title}</h2>
            <span style="font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 10px;">${latestPost.date}</span>
            <div class="blog-body-text">${latestPost.content}</div>
          </div>
        </article>
      `;

      // LOCATION 2: Render Post Cards Grid
      blogPosts.forEach(post => {
        const shortExcerpt = post.content.length > 120 ? post.content.substring(0, 120) + '...' : post.content;
        gridLoc.innerHTML += `
          <article class="grid-card">
            <img src="${post.image}" alt="${post.title}">
            <div class="grid-card-body">
              <span style="font-size: 0.75rem; color: var(--muted);">${post.date}</span>
              <h3>${post.title}</h3>
              <p>${shortExcerpt}</p>
            </div>
          </article>
        `;
      });

      // LOCATION 3: Render Compact Sidebar Items
      blogPosts.slice(0, 4).forEach(post => {
        sidebarLoc.innerHTML += `
          <div class="sidebar-item">
            <img src="${post.image}" alt="${post.title}">
            <div>
              <h4>${post.title}</h4>
              <span>${post.date}</span>
            </div>
          </div>
        `;
      });
    }

    // Modal Control Functions
    function openModal() { document.getElementById('blogModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('blogModal').style.display = 'none'; }

    // Handle Adding New Blog Form
    document.getElementById('addBlogForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const newBlog = {
        id: Date.now(),
        title: document.getElementById('title').value,
        content: document.getElementById('content').value,
        image: document.getElementById('image').value,
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
      };

      blogPosts.unshift(newBlog);
      renderBlogs();
      this.reset();
      closeModal();
    });

    // Initial render call
    document.addEventListener('DOMContentLoaded', renderBlogs);
  </script>
</body>
</html>
