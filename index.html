<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Journey</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #e63946;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .date-badge {
            display: inline-block;
            background-color: #ffe5ec;
            color: #d63384;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 10px;
        }

        .stat-card {
            background: #fff0f3;
            border: 1px solid #ffccd5;
            border-radius: 15px;
            padding: 20px;
            transition: transform 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
        }

        .stat-card .icon {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
            color: #c9184a;
        }

        .stat-card .label {
            font-size: 0.85rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Our Journey Together</h1>
        <div class="date-badge">Together Since: February 5th</div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">💋</div>
                <div class="value">169</div>
                <div class="label">Liplocks</div>
            </div>

            <div class="stat-card">
                <div class="icon">😘</div>
                <div class="value">192</div>
                <div class="label">Kisses</div>
            </div>
        </div>
    </div>

</body>
</html>
